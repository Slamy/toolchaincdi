name: Build the Linux toolchain

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'A release tag (v*) to attach the set to, built from the chosen branch'
        required: false
        default: ''

# build-linux64.sh builds it in an Ubuntu 22.04 container: the programs need the glibc of the
# system they were built on or newer, so an older build system makes them run on more systems.
# Every run uploads toolchaincdi-<commit>-linux64.tar.gz as an artifact (a tar keeps the
# programs' execute permissions, which the artifact's zip drops); a pushed tag v* also attaches
# toolchaincdi-<tag>-linux64.tar.gz to the release of that tag. A manual run with a release tag
# does that for an existing release from the chosen branch (for a release older than this
# workflow, from a commit with the same sources).
jobs:
  build:
    runs-on: ubuntu-26.04
    container: ubuntu:26.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      name: ${{ steps.name.outputs.name }}
      release: ${{ steps.name.outputs.release }}
    steps:
      # git before the checkout, which otherwise downloads the files without git
      - name: Install the packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            build-essential m4 bison flex texinfo zlib1g-dev wget xz-utils ca-certificates file git
      - uses: actions/checkout@v4
      # the container runs as root, the checkout belongs to the runner's user; psximager and
      # Musashi are not part of the toolchain
      - name: Check out the submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 src/binutils-gdb src/gcc src/newlib-cygwin src/m68k-os9-tools
      - name: Name the build
        id: name
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "$RELEASE" ]; then v=$RELEASE
          elif [ "$GITHUB_REF_TYPE" = tag ]; then v=$GITHUB_REF_NAME
          else v=${GITHUB_SHA::7}; fi
          echo "name=toolchaincdi-$v-linux64" >> "$GITHUB_OUTPUT"
          if [ -n "$RELEASE" ] || [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "release=$v" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: ./build-linux64.sh ${{ steps.name.outputs.name }}
      - name: Compile a program with it
        env:
          NAME: ${{ steps.name.outputs.name }}
        run: |
          printf '#include <stdio.h>\nint main(void)\n{\n\tprintf("hello\\n");\n\treturn 0;\n}\n' > hello.c
          "$NAME/bin/m68k-os9-gcc" -o hello hello.c
          ls -l hello
      - name: Pack it
        run: tar czf ${{ steps.name.outputs.name }}.tar.gz ${{ steps.name.outputs.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ steps.name.outputs.name }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: needs.build.outputs.release != ''
    runs-on: ubuntu-24.04
    # attaching a file to a release needs contents: write
    permissions:
      contents: write
    env:
      NAME: ${{ needs.build.outputs.name }}
      RELEASE: ${{ needs.build.outputs.release }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.name }}
      - name: Attach it to the release
        run: |
          # a pushed tag gets a release; a manual run's must exist
          gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || {
            [ "$GITHUB_REF_TYPE" = tag ] &&
              gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" --title "$RELEASE" --notes ""
          }
          gh release upload "$RELEASE" "$NAME.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber
