name: Build a docker container

on:
  push:
    branches:
      - main
  workflow_dispatch:

# see: https://github.com/marketplace/actions/build-and-push-docker-images
jobs:
  build:
    runs-on: ubuntu-26.04
    # GITHUB_TOKEN is read-only by default in new repositories; pushing to ghcr.io needs packages: write.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/slamy/toolchaincdi:latest
            ghcr.io/slamy/toolchaincdi:${{ github.sha }}
